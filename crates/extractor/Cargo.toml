[package]
name = "veridyct-extractor"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

# Deliberately isolated until the coordinator integrates the root workspace.
[workspace]
resolver = "3"

[dependencies]
anyhow = "1.0"
csv = "1.3"
fancy-regex = "0.16"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
sha2 = "0.10"
tempfile = "3.23"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
