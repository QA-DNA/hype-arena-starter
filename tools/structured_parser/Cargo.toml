[package]
name = "veridyct-structured-parser-tools"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
veridyct-core = { path = "../../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
regex = "1"

[lints.rust]
unsafe_code = "forbid"
